# Optional OAuth gateway, sharing only the API container's private network namespace.
# Route OAuth metadata/approval/token/registration and /mcp through the HTTPS edge.
services:
  api:
    ports:
      - '127.0.0.1:8009:8001'
  mcp:
    image: unios-server:${UNIOS_VERSION:-0.1.30}
    user: '10001:10001'
    command: ['python', '-m', 'clients.uni_mcp.remote']
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    env_file: ${UNIOS_STATE_ROOT:-.}/server.env
    environment:
      UNIOS_HOME: /var/lib/unios
      UNIOS_SERVER_KEY: /run/secrets/unios.key
      UNIOS_MCP_BIND_HOST: '0.0.0.0'
    volumes:
      - '${UNIOS_STATE_ROOT:-.}/state:/var/lib/unios'
      - '${UNIOS_STATE_ROOT:-.}/secrets/unios.key:/run/secrets/unios.key:ro'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
