# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "unios-desktop"
version = "0.1.27"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-shell = "=2.4.0"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-single-instance = { version = "=2.5.0", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.5.0"
tauri-plugin-updater = "=2.13.0"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
semver = "=1.0.28"
time = { version = "=0.3.55", features = ["parsing"] }

# GTK3 in Tauri still requires GLib 0.18. This exact upstream backport fixes
# RUSTSEC-2024-0429 without mixing incompatible GTK/GLib type versions.
[patch.crates-io]
glib = { path = "vendor/glib" }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "=0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
