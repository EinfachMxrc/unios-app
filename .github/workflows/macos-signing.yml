# SPDX-License-Identifier: AGPL-3.0-or-later
name: macOS Signierprüfung
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-signing-check]
permissions:
  contents: read
jobs:
  signing:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest tests/test_macos_signing.py -vv -s
