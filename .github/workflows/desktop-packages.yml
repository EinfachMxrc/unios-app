# SPDX-License-Identifier: AGPL-3.0-or-later
name: Desktop-Pakete

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quality-gate:
    name: Vollständige Qualitätsmatrix vor Paketbau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gleichen Commit und alle Plattformen prüfen
        run: python3 scripts/check_release_quality.py
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: quality-gate
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            id: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            id: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            id: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            id: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      UNIOS_UPDATER_PUBLIC_KEY: ${{ vars.UNIOS_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux-Bibliotheken
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: uv sync --locked --extra package --extra voice --group dev
      - run: npm ci
        working-directory: frontend
      - name: macOS-Signierung vorbereiten
        if: runner.os == 'macOS'
        id: mac-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash scripts/prepare_macos_signing.sh
      - name: Installer bauen
        run: uv run --no-sync python scripts/build_desktop.py
      - name: Signatur und Notarisierung prüfen
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'developer-id'
        run: |
          for app in desktop/src-tauri/target/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          for dmg in desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$dmg"
          done
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v5
        with:
          name: unios-${{ matrix.id }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
